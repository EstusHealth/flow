<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"></head><body>
<title>Linework</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a drafting table. Floating panels around a ruled paper canvas: shapes left, inspector right, pages along the bottom. */
:root{
  --bg:#e8ebf0; --panel:#f7f8fa; --raised:#ffffff; --line:#d9dee6; --line-2:#c6cdd8;
  --ink:#1b2130; --ink-2:#536074; --ink-3:#8a93a4;
  --accent:#2b59d9; --accent-ink:#ffffff; --accent-soft:#e2e9fb;
  --canvas:#fbfcfd; --grid:#eef1f5; --grid-major:#e0e5ec;
  --guide:#de2f7c; --ok:#2f8a3a; --warn:#b7791f; --danger:#c2412d;
  --d-ink:#1b2130; --d-fill:#ffffff; --d-line:#3b4556; --d-bg:#fbfcfd;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 10px 28px rgba(20,30,50,.12);
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1015; --panel:#161a21; --raised:#1e232c; --line:#272d37; --line-2:#363d4a;
  --ink:#e4e8ef; --ink-2:#a3acbb; --ink-3:#6f7888;
  --accent:#7598ff; --accent-ink:#0b1430; --accent-soft:#1f2b48;
  --canvas:#12151b; --grid:#181c23; --grid-major:#222833;
  --guide:#ff5ca0; --ok:#5cc26a; --warn:#e0a743; --danger:#f0735d;
  --d-ink:#e4e8ef; --d-fill:#1b2029; --d-line:#a9b2c1; --d-bg:#12151b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1015; --panel:#161a21; --raised:#1e232c; --line:#272d37; --line-2:#363d4a;
  --ink:#e4e8ef; --ink-2:#a3acbb; --ink-3:#6f7888;
  --accent:#7598ff; --accent-ink:#0b1430; --accent-soft:#1f2b48;
  --canvas:#12151b; --grid:#181c23; --grid-major:#222833;
  --guide:#ff5ca0; --ok:#5cc26a; --warn:#e0a743; --danger:#f0735d;
  --d-ink:#e4e8ef; --d-fill:#1b2029; --d-line:#a9b2c1; --d-bg:#12151b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark}

html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{height:100%;display:grid;grid-template-columns:236px minmax(0,1fr) 276px;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0;min-height:0}

/* top bar */
#top{grid-column:1/-1;display:flex;align-items:center;gap:8px;height:46px;padding:0 6px 0 10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;letter-spacing:-.01em;padding-right:4px}
.brand svg{width:22px;height:22px;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.docname{display:flex;align-items:center;min-width:0;border-left:1px solid var(--line);padding-left:10px;gap:2px}
#docName{border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 7px;width:clamp(120px,22vw,260px);font-weight:550;text-overflow:ellipsis}
#docName:hover{border-color:var(--line)}
#docName:focus{border-color:var(--accent);background:var(--raised);outline:none}
.tools{display:flex;gap:2px;margin:0 auto;background:var(--raised);border:1px solid var(--line);border-radius:9px;padding:3px}
.tbtn{position:relative;width:32px;height:30px;display:grid;place-items:center;border:0;background:transparent;border-radius:6px;color:var(--ink-2)}
.tbtn:hover{background:var(--accent-soft);color:var(--ink)}
.tbtn.on{background:var(--accent);color:var(--accent-ink)}
.tbtn[disabled]{opacity:.35;cursor:default;background:transparent}
.tsep{width:1px;background:var(--line);margin:4px 3px}
.right{display:flex;align-items:center;gap:4px}
.save{font:11px/1 var(--mono);color:var(--ink-3);padding:0 8px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.save i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:block}
.save.saving i{background:var(--warn)}.save.bad i{background:var(--danger)}.save.bad{color:var(--danger)}
.btn{height:32px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--raised);color:var(--ink);font-weight:550;white-space:nowrap}
.btn:hover{border-color:var(--line-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--accent-soft);color:var(--ink)}
.kbd{font:11px/1 var(--mono);color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:3px 5px;background:var(--panel)}
.narrow-only{display:none}

/* library */
#lib{display:flex;flex-direction:column;overflow:hidden}
.lib-search{padding:10px 10px 6px;position:relative}
.lib-search .ic{position:absolute;left:19px;top:18px;width:15px;height:15px;color:var(--ink-3)}
.lib-search input{width:100%;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--raised);padding:0 10px 0 30px}
.lib-search input:focus{outline:none;border-color:var(--accent)}
.lib-scroll{overflow:auto;padding:0 10px 10px;flex:1}
.lib-h{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;padding:12px 2px 6px;font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.lib-h .ic{width:14px;height:14px;transition:transform .15s}
.lib-h.shut .ic{transform:rotate(-90deg)}
.lib-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.lib-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 6px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--ink-2);touch-action:none;user-select:none}
.lib-item:hover{background:var(--raised);border-color:var(--line);color:var(--ink)}
.lib-item svg{width:52px;height:36px;overflow:visible}
.lib-item span{font-size:10.5px;line-height:1.2;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib-foot{display:grid;gap:6px;padding:10px;border-top:1px solid var(--line)}
.lib-foot .btn{justify-content:flex-start;width:100%;font-weight:500}
.ghost-drag{position:fixed;z-index:50;pointer-events:none;opacity:.85;transform:translate(-50%,-50%);color:var(--accent)}
.ghost-drag svg{width:72px;height:52px;overflow:visible}

/* stage */
#stage{position:relative;overflow:hidden;display:grid;grid-template-columns:20px minmax(0,1fr);grid-template-rows:20px minmax(0,1fr);border-radius:10px}
#stage.norulers{grid-template-columns:0 minmax(0,1fr);grid-template-rows:0 minmax(0,1fr)}
#stage.norulers canvas,#stage.norulers .corner{display:none}
.corner{background:var(--panel);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
#rulerX,#rulerY{display:block;width:100%;height:100%;background:var(--panel)}
#rulerX{border-bottom:1px solid var(--line)}#rulerY{border-right:1px solid var(--line)}
#wrap{position:relative;overflow:hidden;background-color:var(--canvas)}
#svg{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#svg.panning{cursor:grab}#svg.grabbing{cursor:grabbing}
#svg.crosshair{cursor:crosshair}
.hit{fill:none;stroke:transparent;stroke-width:14px;vector-effect:non-scaling-stroke;pointer-events:stroke}
[data-id]{cursor:default}
.ov-box{fill:none;stroke:var(--accent);stroke-width:1.25px;vector-effect:non-scaling-stroke;pointer-events:none}
.ov-thin{fill:none;stroke:var(--accent);stroke-width:1px;vector-effect:non-scaling-stroke;opacity:.6;pointer-events:none}
.ov-target{fill:color-mix(in srgb,var(--accent) 10%,transparent);stroke:var(--accent);stroke-width:2px;vector-effect:non-scaling-stroke;pointer-events:none}
.ov-handle{fill:var(--raised);stroke:var(--accent);stroke-width:1.25px;vector-effect:non-scaling-stroke}
.ov-ep{fill:var(--accent);stroke:var(--raised);stroke-width:2px;vector-effect:non-scaling-stroke;cursor:move}
.ov-ep.free{fill:var(--raised);stroke:var(--accent)}
.ov-edge{fill:none;stroke:var(--accent);stroke-width:2px;vector-effect:non-scaling-stroke;opacity:.55;pointer-events:none}
.ov-temp{fill:none;stroke:var(--accent);stroke-width:1.75px;vector-effect:non-scaling-stroke;stroke-dasharray:5 4;pointer-events:none}
.ov-guide{stroke:var(--guide);stroke-width:1px;vector-effect:non-scaling-stroke;pointer-events:none}
.ov-guide-dot{fill:var(--guide);pointer-events:none}
.ov-marquee{fill:color-mix(in srgb,var(--accent) 7%,transparent);stroke:var(--accent);stroke-width:1px;vector-effect:non-scaling-stroke;pointer-events:none}
.ov-cn{cursor:crosshair}
.ov-cn circle{fill:var(--accent);stroke:var(--canvas);stroke-width:2px;vector-effect:non-scaling-stroke;opacity:.92}
.ov-cn:hover circle{opacity:1}
.ov-cn path{fill:none;stroke:var(--accent-ink);stroke-width:1.6px;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.ov-snap{fill:var(--guide);stroke:var(--raised);stroke-width:1.5px;vector-effect:non-scaling-stroke;pointer-events:none}
.ov-tag rect{fill:var(--accent)}
.ov-tag text{fill:var(--accent-ink);font-family:var(--mono)}

.editor{position:absolute;z-index:5;display:flex;pointer-events:auto}
.editor.v-top{align-items:flex-start}.editor.v-middle{align-items:center}.editor.v-bottom{align-items:flex-end}
.editor .inner{width:100%;outline:none;white-space:pre-wrap;word-break:break-word;line-height:1.3;caret-color:var(--accent);min-height:1.3em;cursor:text}
.editor{box-shadow:0 0 0 1.5px var(--accent);border-radius:3px}
.editor.edge{transform:translate(-50%,-50%);background:var(--canvas);padding:3px 6px}
.editor.edge .inner{min-width:30px;text-align:center}

.zoom{position:absolute;right:12px;bottom:12px;display:flex;align-items:center;background:var(--raised);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);padding:3px;gap:1px;z-index:4;margin-right:env(safe-area-inset-right,0px)}
.zoom .tbtn{width:28px;height:28px}
.zoom .zl{border:0;background:none;font:12px/1 var(--mono);min-width:52px;height:28px;border-radius:6px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.zoom .zl:hover{background:var(--accent-soft);color:var(--ink)}
.empty-hint{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:var(--ink-3);text-align:center}
.empty-hint div{max-width:300px;line-height:1.5}
.empty-hint b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:4px}

/* inspector */
#insp{overflow:auto}
.insp-title{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 10px;border-bottom:1px solid var(--line);font-weight:650;position:sticky;top:0;background:var(--panel);z-index:1}
.insp-title .acts{display:flex;gap:2px}
.sec{padding:12px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.sec:last-child{border-bottom:0}
.sec-h{font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.row{display:grid;grid-template-columns:62px minmax(0,1fr);align-items:center;gap:8px}
.row>label,.row>.lbl{color:var(--ink-2);font-size:12px}
.sw-row{display:flex;flex-wrap:wrap;gap:5px}
.sw{width:22px;height:22px;border-radius:6px;border:1px solid var(--line-2);background:var(--c);padding:0;position:relative}
.sw.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.sw.auto{background:linear-gradient(135deg,#ffffff 0 50%,#1b2029 50% 100%)}
.sw.none{background:var(--raised)}
.sw.none::after{content:"";position:absolute;inset:3px;background:linear-gradient(to top right,transparent calc(50% - 1px),var(--danger) calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px))}
.sw.custom{background:conic-gradient(#e5484d,#f5a524,#46a758,#3e63dd,#8e4ec6,#e5484d);overflow:hidden}
.sw.custom input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:0;padding:0}
.qs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.qs button{height:28px;border-radius:6px;border:1.5px solid var(--b);background:var(--f);color:var(--t);font-weight:650;font-size:11px;padding:0}
.qs button:hover{transform:translateY(-1px);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.seg{display:flex;background:var(--raised);border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px;min-width:0}
.seg button{flex:1;min-width:0;height:26px;border:0;background:none;border-radius:5px;color:var(--ink-2);font-size:12px;display:grid;place-items:center;padding:0 4px;white-space:nowrap}
.seg button:hover{color:var(--ink);background:var(--accent-soft)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg .ic{width:16px;height:16px}
.mk{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px}
.mk button{height:28px;border:1px solid var(--line);background:var(--raised);border-radius:6px;display:grid;place-items:center;color:var(--ink-2);padding:0}
.mk button.on{border-color:var(--accent);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mk svg{width:30px;height:14px;overflow:visible}
input[type=range]{width:100%;accent-color:var(--accent)}
.rng{display:flex;align-items:center;gap:8px}.rng output{font:11px var(--mono);color:var(--ink-3);min-width:30px;text-align:right;font-variant-numeric:tabular-nums}
.field{height:30px;border:1px solid var(--line);background:var(--raised);border-radius:7px;padding:0 8px;width:100%;min-width:0}
.field:focus{outline:none;border-color:var(--accent)}
.geo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.geo label{display:flex;align-items:center;border:1px solid var(--line);background:var(--raised);border-radius:7px;height:30px;padding-left:8px;gap:6px;font:11px var(--mono);color:var(--ink-3)}
.geo label:focus-within{border-color:var(--accent)}
.geo input{border:0;background:none;width:100%;min-width:0;height:100%;font:12px var(--mono);font-variant-numeric:tabular-nums;outline:none}
.btn-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.ibtn{height:30px;border:1px solid var(--line);background:var(--raised);border-radius:7px;display:grid;place-items:center;color:var(--ink-2);padding:0}
.ibtn:hover{color:var(--ink);border-color:var(--line-2)}
.ibtn.on{color:var(--accent);border-color:var(--accent)}
.ibtn[disabled]{opacity:.4;cursor:default}
.tog{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--ink-2);font-size:12px;cursor:pointer}
.switch{width:32px;height:18px;border-radius:9px;background:var(--line-2);border:0;padding:0;position:relative;flex:none}
.switch::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;left:2px;top:2px;transition:left .15s}
.switch.on{background:var(--accent)}.switch.on::after{left:16px}
.hint{color:var(--ink-3);font-size:12px;line-height:1.5}
.keys{display:grid;gap:6px;font-size:12px;color:var(--ink-2)}
.keys div{display:flex;justify-content:space-between;gap:8px;align-items:center}
.stat{font:11px var(--mono);color:var(--ink-3)}
.wide-btns{display:grid;gap:6px}.wide-btns .btn{justify-content:flex-start;font-weight:500}

/* bottom */
#bottom{grid-column:1/-1;display:flex;align-items:center;gap:8px;height:38px;padding:0 6px;min-width:0}
.tabs{display:flex;gap:2px;overflow-x:auto;min-width:0;flex:1;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{height:28px;border:0;background:none;border-radius:7px;padding:0 12px;color:var(--ink-2);white-space:nowrap;font-weight:500}
.tab:hover{background:var(--raised);color:var(--ink)}
.tab.on{background:var(--raised);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2);font-weight:600}
.tab-in{height:28px;border:1px solid var(--accent);border-radius:7px;padding:0 8px;width:130px;background:var(--raised)}
.status{font:11px/1 var(--mono);color:var(--ink-3);display:flex;gap:14px;white-space:nowrap;padding-right:6px;font-variant-numeric:tabular-nums}

/* menus, popups, modals */
.menu{position:fixed;z-index:60;min-width:210px;max-width:300px;background:var(--raised);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:5px;max-height:70vh;overflow:auto}
.menu button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;border-radius:6px;padding:7px 9px;text-align:left;color:var(--ink)}
.menu button:hover{background:var(--accent-soft)}
.menu button[disabled]{opacity:.4;cursor:default;background:none}
.menu button.danger{color:var(--danger)}
.menu button.armed{background:var(--danger);color:#fff}
.menu .k{margin-left:auto;font:11px var(--mono);color:var(--ink-3)}
.menu .sep{height:1px;background:var(--line);margin:5px 4px}
.menu .mh{font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:8px 9px 4px}
.menu .cur{color:var(--accent);font-weight:600}
.menu .x{margin-left:auto;opacity:.5;border-radius:4px;padding:2px}
.menu .x:hover{opacity:1;color:var(--danger)}
.qp{position:fixed;z-index:60;background:var(--raised);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;display:grid;grid-template-columns:repeat(4,44px);gap:4px}
.qp button{height:40px;border:1px solid transparent;background:none;border-radius:7px;display:grid;place-items:center;color:var(--ink-2)}
.qp button:hover{background:var(--accent-soft);border-color:var(--line);color:var(--ink)}
.qp svg{width:32px;height:24px;overflow:visible}
.qp .qp-h{grid-column:1/-1;font-size:11px;color:var(--ink-3);padding:2px 4px 2px}

#modalRoot[hidden]{display:none}
.backdrop{position:fixed;inset:0;z-index:70;background:rgba(10,14,22,.42);display:grid;place-items:center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal-h h2{font-size:15px;margin:0;font-weight:650;text-wrap:balance}
.modal-b{padding:16px;display:grid;gap:14px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal.export{width:min(860px,100%)}
.ex{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
.ex-prev{border:1px solid var(--line);border-radius:10px;min-height:260px;display:grid;place-items:center;padding:16px;overflow:hidden;
  background-color:var(--raised);background-image:linear-gradient(45deg,var(--grid-major) 25%,transparent 25%,transparent 75%,var(--grid-major) 75%),linear-gradient(45deg,var(--grid-major) 25%,transparent 25%,transparent 75%,var(--grid-major) 75%);background-size:16px 16px;background-position:0 0,8px 8px}
.ex-prev img{max-width:100%;max-height:340px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.ex-meta{font:11px var(--mono);color:var(--ink-3);margin-top:6px}
.ex-opts{display:grid;gap:12px;align-content:start}
.ex-opts .lbl{font-size:12px;color:var(--ink-2);margin-bottom:4px;display:block}
.pal{width:min(600px,100%);align-self:start;margin-top:10vh}
.pal input{border:0;border-bottom:1px solid var(--line);background:none;width:100%;padding:16px 18px;font-size:15px;outline:none}
.pal-list{max-height:52vh;overflow:auto;padding:6px}
.pal-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;cursor:pointer}
.pal-item.on{background:var(--accent-soft)}
.pal-item .grp{font-size:11px;color:var(--ink-3);min-width:56px}
.pal-item .k{margin-left:auto;font:11px var(--mono);color:var(--ink-3)}
.pal-empty{padding:18px;color:var(--ink-3);text-align:center}
textarea.code{width:100%;min-height:240px;border:1px solid var(--line);border-radius:8px;background:var(--raised);padding:10px 12px;font:12.5px/1.5 var(--mono);resize:vertical}
textarea.code:focus{outline:none;border-color:var(--accent)}
.err{color:var(--danger);font-size:12px}
.sc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 24px}
.sc-grid div{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.sc-grid .kbd{white-space:nowrap}
#toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:9px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:80;max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#fileIn,#imgIn{display:none}

@media (max-width:980px){
  #app{grid-template-columns:minmax(0,1fr)}
  #lib,#insp{position:fixed;top:62px;bottom:58px;z-index:40;width:min(300px,86vw);box-shadow:var(--shadow);transition:transform .2s ease;background:var(--panel)}
  #lib{left:max(16px,env(safe-area-inset-left,0px));transform:translateX(calc(-100% - 40px))}
  #insp{right:max(16px,env(safe-area-inset-right,0px));transform:translateX(calc(100% + 40px))}
  #app.lib-open #lib,#app.insp-open #insp{transform:none}
  .narrow-only{display:grid}
  .brand span,.hide-narrow{display:none}
}
@media (max-width:640px){
  .tools .opt{display:none}
  #top{flex-wrap:wrap;height:auto;padding:6px;row-gap:6px}
  .tools{order:3;flex-basis:100%;justify-content:center;margin:0}
  .brand,#themeBtn{display:none}
  .docname{border-left:0;padding-left:0;flex:1}
  #docName{width:100%;min-width:60px}
  .right{margin-left:auto}
  .save span{display:none}
  .status .opt{display:none}
  .ex{grid-template-columns:minmax(0,1fr)}
  .sc-grid{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ================= fonts & colours ================= */

/* ================= geometry ================= */
function rr(x,y,w,h,r){r=Math.max(0,Math.min(r||0,w/2,h/2));if(!r)return`M${N(x)} ${N(y)}H${N(x+w)}V${N(y+h)}H${N(x)}Z`;
  return`M${N(x+r)} ${N(y)}H${N(x+w-r)}A${N(r)} ${N(r)} 0 0 1 ${N(x+w)} ${N(y+r)}V${N(y+h-r)}A${N(r)} ${N(r)} 0 0 1 ${N(x+w-r)} ${N(y+h)}H${N(x+r)}A${N(r)} ${N(r)} 0 0 1 ${N(x)} ${N(y+h-r)}V${N(y+r)}A${N(r)} ${N(r)} 0 0 1 ${N(x+r)} ${N(y)}Z`}
function scalePath(p,sx,sy){let i=0;return p.replace(/-?\d*\.?\d+/g,m=>N(+m*((i++%2)?sy:sx)))}
const CLOUD='M25 55C10 55 4 45 9 37C2 30 8 17 21 20C25 8 41 5 50 13C58 3 77 6 79 18C92 17 99 30 92 38C98 47 91 57 78 55Z';
function geom(t,w,h,r){
  switch(t){
    case 'pill':return{d:rr(0,0,w,h,Math.min(w,h)/2)};
    case 'container':return{d:rr(0,0,w,h,r),extra:`M0 34H${N(w)}`};
    case 'note':return{d:`M0 0H${N(w)}V${N(h-18)}L${N(w-18)} ${N(h)}H0Z`,fold:`M${N(w-18)} ${N(h)}V${N(h-18)}H${N(w)}Z`};
    case 'ellipse':return{d:`M${N(w/2)} 0A${N(w/2)} ${N(h/2)} 0 1 1 ${N(w/2)} ${N(h)}A${N(w/2)} ${N(h/2)} 0 1 1 ${N(w/2)} 0Z`};
    case 'diamond':return{d:`M${N(w/2)} 0L${N(w)} ${N(h/2)}L${N(w/2)} ${N(h)}L0 ${N(h/2)}Z`};
    case 'triangle':return{d:`M${N(w/2)} 0L${N(w)} ${N(h)}H0Z`};
    case 'hexagon':{const k=Math.min(w*.25,h*.5);return{d:`M${N(k)} 0H${N(w-k)}L${N(w)} ${N(h/2)}L${N(w-k)} ${N(h)}H${N(k)}L0 ${N(h/2)}Z`}}
    case 'parallelogram':{const k=Math.min(w*.2,h*.6);return{d:`M${N(k)} 0H${N(w)}L${N(w-k)} ${N(h)}H0Z`}}
    case 'trapezoid':{const k=Math.min(w*.15,h*.5);return{d:`M0 0H${N(w)}L${N(w-k)} ${N(h)}H${N(k)}Z`}}
    case 'document':{const v=h*.12;return{d:`M0 0H${N(w)}V${N(h-v)}Q${N(w*.75)} ${N(h-v*3)} ${N(w/2)} ${N(h-v)}T0 ${N(h-v)}Z`}}
    case 'cylinder':{const ry=Math.min(h*.14,w*.22);return{d:`M0 ${N(ry)}A${N(w/2)} ${N(ry)} 0 0 1 ${N(w)} ${N(ry)}V${N(h-ry)}A${N(w/2)} ${N(ry)} 0 0 1 0 ${N(h-ry)}Z`,extra:`M0 ${N(ry)}A${N(w/2)} ${N(ry)} 0 0 0 ${N(w)} ${N(ry)}`}}
    case 'predefined':{const k=Math.min(14,w*.1);return{d:rr(0,0,w,h,r),extra:`M${N(k)} 0V${N(h)}M${N(w-k)} 0V${N(h)}`}}
    case 'star':{let d='';const cx=w/2,cy=h*.525,rx=w/2,ry=h*.525;for(let i=0;i<10;i++){const a=(-90+36*i)*Math.PI/180,k=i%2?.42:1;d+=(i?'L':'M')+N(cx+Math.cos(a)*rx*k)+' '+N(cy+Math.sin(a)*ry*k)}return{d:d+'Z'}}
    case 'cloud':return{d:scalePath(CLOUD,w/100,h/60)};
    case 'arrow':{const hd=Math.min(w*.4,h*.9);return{d:`M0 ${N(h*.25)}H${N(w-hd)}V0L${N(w)} ${N(h/2)}L${N(w-hd)} ${N(h)}V${N(h*.75)}H0Z`}}
    case 'callout':{const b=h*.76;return{d:rr(0,0,w,b,r||8),tail:`M${N(w*.22)} ${N(b-1.5)}L${N(w*.18)} ${N(h)}L${N(w*.4)} ${N(b-1.5)}`}}

  for(const it of list){if(!it)continue;const b=itemBox(it);x1=Math.min(x1,b.x);y1=Math.min(y1,b.y);x2=Math.max(x2,b.x+b.w);y2=Math.max(y2,b.y+b.h);n++}
  return n?{x:x1,y:y1,w:x2-x1,h:y2-y1}:null;

/* ================= history & storage ================= */
function commit(){
  const s=JSON.stringify(doc);

  render();
}
function restore(s){const pid=doc.pageId;doc=JSON.parse(s);const keep=new Set(items().map(i=>i.id));sel=new Set([...sel].filter(id=>keep.has(id)));if(doc.pageId!==pid)sel.clear();scheduleSave();render();renderTabs()}

let saveT=null;
function scheduleSave(){setSave('saving');clearTimeout(saveT);saveT=setTimeout(saveNow,450)}
function saveNow(){
  clearTimeout(saveT);if(!doc)return;
  if(!store.ok){setSave('off');return}
  doc.updated=Date.now();
  const ok=store.set(kDoc(doc.id),JSON.stringify(doc));
  const idx=readIndex().filter(d=>d.id!==doc.id);idx.unshift({id:doc.id,name:doc.name,updated:doc.updated});writeIndex(idx);
  prefs.last=doc.id;savePrefs();setSave(ok?'saved':'full');
}

  el.querySelector('span').textContent={saved:'Saved',saving:'Saving',full:'Storage full',off:'Storage blocked'}[st];
  el.title=st==='full'?'This browser ran out of local storage. Export a JSON backup and remove large images.':st==='off'?'This browser blocks local storage here, so changes last only until you close the page. Export JSON to keep them.':'Saved automatically in this browser'}

/* ================= view ================= */

  if(doc.settings.grid){let b=10;while(b*view.z<7)b*=5;const m=b*view.z,M5=m*5;
    wrapEl.style.backgroundImage='linear-gradient(to right,var(--grid-major) 1px,transparent 1px),linear-gradient(to bottom,var(--grid-major) 1px,transparent 1px),linear-gradient(to right,var(--grid) 1px,transparent 1px),linear-gradient(to bottom,var(--grid) 1px,transparent 1px)';
    wrapEl.style.backgroundSize=`${M5}px ${M5}px,${M5}px ${M5}px,${m}px ${m}px,${m}px ${m}px`;
    const p=`${N(view.x)}px ${N(view.y)}px`;wrapEl.style.backgroundPosition=[p,p,p,p].join(',');
  }else wrapEl.style.backgroundImage='none';
  $('#zLbl').textContent=Math.round(view.z*100)+'%';

function zoomAt(z,sx,sy){z=clamp(z,.1,8);const wx=(sx-view.x)/view.z,wy=(sy-view.y)/view.z;view.z=z;view.x=sx-wx*z;view.y=sy-wy*z;applyView()}

  const r=svg.getBoundingClientRect();if(!r.width)return;
  if(!b){view={x:r.width/2,y:r.height/2,z:1};applyView();return}
  const pad=Math.min(70,r.width*.08),z=clamp(Math.min((r.width-pad*2)/Math.max(b.w,1),(r.height-pad*2)/Math.max(b.h,1)),.1,maxZ);

}
const fitView=()=>fitTo(bboxOf(items()));
const fitSel=()=>{const b=bboxOf(selItems());if(b)fitTo(b,2.5)};

/* rulers */
let rulerCols=null;
function drawRulers(){
  stage.classList.toggle('norulers',!prefs.rulers);if(!prefs.rulers)return;
  const cs=getComputedStyle(document.documentElement);
  rulerCols={bg:cs.getPropertyValue('--panel').trim(),ink:cs.getPropertyValue('--ink-3').trim(),line:cs.getPropertyValue('--line-2').trim(),acc:cs.getPropertyValue('--accent-soft').trim(),accLine:cs.getPropertyValue('--accent').trim()};
  const selB=bboxOf(selItems());
  for(const[id,horiz]of[['rulerX',true],['rulerY',false]]){
    const c=$('#'+id),dpr=window.devicePixelRatio||1,W=c.clientWidth,H=c.clientHeight;if(!W||!H)continue;
    if(c.width!==Math.round(W*dpr)||c.height!==Math.round(H*dpr)){c.width=Math.round(W*dpr);c.height=Math.round(H*dpr)}
    const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.fillStyle=rulerCols.bg;g.fillRect(0,0,W,H);
    const len=horiz?W:H,off=horiz?view.x:view.y,z=view.z;
    if(selB){const a=(horiz?selB.x:selB.y)*z+off,b=(horiz?selB.x+selB.w:selB.y+selB.h)*z+off;g.fillStyle=rulerCols.acc;if(horiz)g.fillRect(a,0,b-a,H);else g.fillRect(0,a,W,b-a)}
    const steps=[1,2,5,10,20,25,50,100,200,250,500,1000,2000,5000,10000];const major=steps.find(s=>s*z>=64)||10000;const minor=major/(String(major)[0]==='2'&&major!==25&&major!==250?4:5);
    const start=Math.floor(-off/z/minor)*minor,end=(len-off)/z;
    g.strokeStyle=rulerCols.line;g.fillStyle=rulerCols.ink;g.font='9.5px '+getComputedStyle(document.body).getPropertyValue('--mono');g.lineWidth=1;g.beginPath();
    for(let v=start;v<=end;v+=minor){const p=Math.round(v*z+off)+.5,isM=Math.abs(v/major-Math.round(v/major))<1e-6,t=isM?(horiz?H:W)*.55:(horiz?H:W)*.25;
      if(horiz){g.moveTo(p,H);g.lineTo(p,H-t)}else{g.moveTo(W,p);g.lineTo(W-t,p)}
      if(isM){const lbl=String(Math.round(v));if(horiz)g.fillText(lbl,p+3,10);else{g.save();g.translate(10,p-3);g.rotate(-Math.PI/2);g.fillText(lbl,0,0);g.restore()}}}
    g.stroke();
    if(lastPtr.in){const p=(horiz?lastPtr.wx:lastPtr.wy)*z+off;g.strokeStyle=rulerCols.accLine;g.beginPath();if(horiz){g.moveTo(p,0);g.lineTo(p,H)}else{g.moveTo(0,p);g.lineTo(W,p)}g.stroke()}
  }
}

  }

    if(!editing&&!(drag&&drag.kind==='move'&&drag.moved)){

      for(const[k,[fx,fy]]of Object.entries(dirs)){if(small&&k.length===1)continue;o.push(`<rect class="ov-handle" data-h="rs" data-dir="${k}" style="cursor:${cur[k]}-resize" x="${N(b.x+b.w*fx-hs/2)}" y="${N(b.y+b.h*fy-hs/2)}" width="${N(hs)}" height="${N(hs)}" rx="${N(1.5/z)}"/>`)}

      o.push(`<g class="ov-tag"><rect x="${N(b.x+b.w/2-tw/2)}" y="${N(b.y+b.h+8/z)}" width="${N(tw)}" height="${N(17/z)}" rx="${N(4/z)}"/><text x="${N(b.x+b.w/2)}" y="${N(b.y+b.h+20.5/z)}" text-anchor="middle" font-size="${N(fs)}">${t}</text></g>`)}

    for(const k of['n','e','s','w']){const p=sidePt(cs,k),d=DIRV[k],cx=p.x+d.x*off,cy=p.y+d.y*off,a=4/z,nx=-d.y,ny=d.x;
      o.push(`<g class="ov-cn" data-h="cn" data-id="${cs.id}" data-side="${k}"><circle cx="${N(cx)}" cy="${N(cy)}" r="${N(r)}"/><path d="M${N(cx-d.x*a*.6+nx*a)} ${N(cy-d.y*a*.6+ny*a)}L${N(cx+d.x*a*.7)} ${N(cy+d.y*a*.7)}L${N(cx-d.x*a*.6-nx*a)} ${N(cy-d.y*a*.6-ny*a)}"/></g>`)}}

    if(g.x!=null)o.push(`<line class="ov-guide" x1="${N(g.x)}" x2="${N(g.x)}" y1="${N(g.a)}" y2="${N(g.b)}"/>`);
    else o.push(`<line class="ov-guide" y1="${N(g.y)}" y2="${N(g.y)}" x1="${N(g.a)}" x2="${N(g.b)}"/>`);
  }

/* ================= hit testing ================= */
function shapeAt(p,opt={}){
  const a=items();

    if(p.x>=s.x-m&&p.x<=s.x+s.w+m&&p.y>=s.y-m&&p.y<=s.y+s.h+m){
      if(s.type==='container'&&opt.connect){const e=12/view.z;if(p.x>s.x+e&&p.x<s.x+s.w-e&&p.y>s.y+34&&p.y<s.y+s.h-e)continue}
      return s}}

}
function nearSide(s,p){const t=16/view.z;let best=null,bd=t;for(const k of['n','e','s','w']){const d=dist(sidePt(s,k),p);if(d<bd){bd=d;best=k}}return best}

const overlaps=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function expandGroup(it){if(!it.g)return[it.id];return items().filter(i=>i.g===it.g).map(i=>i.id)}

/* snapping */
function snapBox(bb,exclude,disable){

  const tol=6/view.z,others=items().filter(i=>isShape(i)&&!exclude.has(i.id));
  const xs=[bb.x,bb.x+bb.w/2,bb.x+bb.w],ys=[bb.y,bb.y+bb.h/2,bb.y+bb.h];
  let bx={d:tol+1},by={d:tol+1};
  for(const o of others){const ox=[o.x,o.x+o.w/2,o.x+o.w],oy=[o.y,o.y+o.h/2,o.y+o.h];
    for(const c of ox)for(const v of xs){const d=c-v;if(Math.abs(d)<Math.abs(bx.d))bx={d,c,o}}
    for(const c of oy)for(const v of ys){const d=c-v;if(Math.abs(d)<Math.abs(by.d))by={d,c,o}}}
  let dx=0,dy=0;
  if(Math.abs(bx.d)<=tol){dx=bx.d}else dx=Math.round(bb.x/10)*10-bb.x;
  if(Math.abs(by.d)<=tol){dy=by.d}else dy=Math.round(bb.y/10)*10-bb.y;
  if(Math.abs(bx.d)<=tol){const o=bx.o;guides.push({x:bx.c,a:Math.min(o.y,bb.y+dy)-12,b:Math.max(o.y+o.h,bb.y+dy+bb.h)+12})}

  return{dx,dy};
}

/* ================= pointer interaction ================= */
const pointers=new Map();
const TH=4;
svg.addEventListener('pointerdown',e=>{
  if(editing){finishEdit();}
  closeFloating();
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  try{svg.setPointerCapture(e.pointerId)}catch(_){}

  if(pointers.size>2||e.button===2)return;
  const w=toWorld(e.clientX,e.clientY),st={sx:e.clientX,sy:e.clientY,w,moved:false};
  if(e.button===1||spaceDown||tool==='hand'){e.preventDefault();drag={kind:'pan',...st,vx:view.x,vy:view.y};svg.classList.add('grabbing');return}
  const hEl=e.target.closest&&e.target.closest('[data-h]');
  if(hEl){const h=hEl.dataset.h;
    if(h==='rs'){const S=selShapes(),bb=bboxOf(S);drag={kind:'resize',...st,dir:hEl.dataset.dir,bb,orig:S.map(s=>({s,x:s.x,y:s.y,w:s.w,h:s.h}))};return}
    if(h==='cn'){drag={kind:'connect',...st,src:byId(hEl.dataset.id),side:hEl.dataset.side,fromDot:true};return}
    if(h==='ep'){const ed=byId(hEl.dataset.id);drag={kind:'endpoint',...st,edge:ed,end:hEl.dataset.end};return}
  }
  if(TOOL_SPECS[tool]){drag={kind:'create',...st,spec:TOOL_SPECS[tool]};return}
  if(tool==='connector'){const s=shapeAt(w,{connect:true});drag={kind:'connect',...st,src:s,from:s?null:{x:w.x,y:w.y}};return}
  const el=e.target.closest&&e.target.closest('[data-id]'),it=el&&byId(el.dataset.id);
  if(it){
    const ids=expandGroup(it);
    if(e.shiftKey||e.metaKey||e.ctrlKey){const on=sel.has(it.id);ids.forEach(id=>on?sel.delete(id):sel.add(id));render();return}
    const wasSel=sel.has(it.id);
    if(!wasSel)sel=new Set(ids);
    if(e.altKey){duplicate({x:0,y:0},true)}
    startMove(st,{reduceTo:wasSel&&sel.size>ids.length?ids:null});
    render();return;
  }
  if(e.pointerType==='touch'){drag={kind:'pan',...st,vx:view.x,vy:view.y};return}

});
function startMove(st,o={}){
  const moving=new Set();for(const id of sel){const it=byId(id);if(isShape(it))moving.add(id)}
  for(const id of[...moving]){const c=byId(id);if(c.type==='container')for(const s of items())if(isShape(s)&&!moving.has(s.id)&&inside(s,c))moving.add(s.id)}
  const orig=new Map();for(const id of moving){const s=byId(id);orig.set(id,{x:s.x,y:s.y})}
  const eorig=[];for(const id of sel){const ed=byId(id);if(isEdge(ed))eorig.push({ed,a:ed.a.id?null:{...ed.a},b:ed.b.id?null:{...ed.b}})}
  drag={kind:'move',...st,moving,orig,eorig,bb:bboxOf([...moving].map(byId)),reduceTo:o.reduceTo};

window.addEventListener('pointermove',e=>{
  if(pointers.has(e.pointerId))pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const r=svg.getBoundingClientRect(),inC=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
  const w=toWorld(e.clientX,e.clientY);lastPtr={x:e.clientX,y:e.clientY,wx:w.x,wy:w.y,in:inC};
  if(inC)$('#stPos').textContent=`X ${Math.round(w.x)} · Y ${Math.round(w.y)}`;
  if(libDrag){libMove(e);return}
  if(!drag){
    if(inC&&tool==='select'&&!editing&&e.pointerType!=='touch'){const onCn=e.target.closest&&e.target.closest('.ov-cn');const s=onCn?byId(onCn.dataset.id):shapeAt(w,{pad:28/view.z});const id=s?s.id:null;if(id!==hoverId){hoverId=id;renderOverlay()}}
    if(prefs.rulers&&inC)drawRulers();

  }
  if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>TH)drag.moved=true;
  const mod=e.metaKey||e.ctrlKey;
  switch(drag.kind){
    case'pinch':{if(pointers.size<2)return;const[a,b]=[...pointers.values()],d=Math.hypot(a.x-b.x,a.y-b.y),m={x:(a.x+b.x)/2,y:(a.y+b.y)/2},v=drag.v0,z=clamp(v.z*d/drag.d0,.1,8);
      const wx=(drag.m0.x-r.left-v.x)/v.z,wy=(drag.m0.y-r.top-v.y)/v.z;view={z,x:m.x-r.left-wx*z,y:m.y-r.top-wy*z};applyView();return}

      if(drag.bb){const sn=snapBox({...drag.bb,x:drag.bb.x+dx,y:drag.bb.y+dy},drag.moving,mod);dx+=sn.dx;dy+=sn.dy}

/* ================= editing operations ================= */
function addItems(list){
  const a=items().slice();

  setItems(a);
}
function quickClone(src,side){
  const gap=72,d=DIRV[side];
  const n=normItem({...deep(src),id:uid(),text:''});delete n.g;
  if(n.type==='container'||n.type==='image'||n.type==='text'){Object.assign(n,mkShape(findSpec('rect','Process'),0,0));n.id=uid()}
  n.x=d.x>0?src.x+src.w+gap:d.x<0?src.x-gap-n.w:src.x+src.w/2-n.w/2;
  n.y=d.y>0?src.y+src.h+gap:d.y<0?src.y-gap-n.h:src.y+src.h/2-n.h/2;
  for(let i=0;i<8&&items().some(o=>isShape(o)&&o.type!=='container'&&overlaps(o,n));i++){if(d.x)n.y+=n.h+36;else n.x+=n.w+36}

}

  setItems(items().filter(i=>!ids.has(i.id)));sel.clear();commit();
}

  for(const it of list)if(it.type==='edge'){const n=normItem(deep(it));n.id=uid();let ok=true;
    for(const k of['a','b']){const en=n[k];if(en.id){if(map.has(en.id))en.id=map.get(en.id);else if(!byId(en.id))ok=false}else{en.x+=off.x;en.y+=off.y}}

/* ================= text to diagram ================= */
function parseFlow(src){
  let dir='TD';const nodes=new Map(),order=[],edges=[];
  const SH=[null,null,null,'pill','cylinder','circle','hexagon','parallelogram','rect','round','diamond','rect'];
  const re=/^([^\s\[\(\{>]+?)\s*(\(\[(.*)\]\)|\[\((.*)\)\]|\(\((.*)\)\)|\{\{(.*)\}\}|\[\/(.*)\/\]|\[(.*)\]|\((.*)\)|\{(.*)\}|>(.*)\])$/;
  const node=tok=>{tok=tok.trim();let id=tok,label=tok,shape=null;const m=tok.match(re);
    if(m){id=m[1];for(let i=3;i<SH.length;i++)if(m[i]!==undefined){label=m[i].replace(/^["']|["']$/g,'').trim();shape=SH[i];break}}
    else{label=tok.replace(/^["']|["']$/g,'')}
    label=label.replace(/<br\s*\/?>/gi,'\n');
    if(!nodes.has(id)){nodes.set(id,{id,label:m?label:label,shape:shape||'rect'});order.push(id)}else if(m){const n=nodes.get(id);n.label=label;n.shape=shape}
    return id};
  for(let line of src.replace(/\r/g,'').split(/\n|;/)){
    line=line.trim();if(!line||line.startsWith('%%'))continue;
    const g=line.match(/^(graph|flowchart)\b\s*(TD|TB|BT|LR|RL)?/i);if(g){if(g[2])dir=g[2].toUpperCase()==='TB'?'TD':g[2].toUpperCase();continue}
    if(/^(classDef|class|style|linkStyle|click|subgraph|end|direction)\b/i.test(line))continue;
    line=line.replace(/--\s+([^\->|][^>]*?)\s+-->/g,'-->|$1|').replace(/-\.\s+([^.>]+?)\s+\.->/g,'-.->|$1|').replace(/==\s+([^=>]+?)\s+==>/g,'==>|$1|').replace(/\s*:\s*([^:>]+)$/,(m0,l)=>/(-->|->)/.test(line)?`__LBL__${l}`:m0);
    let tail=null;const lm=line.match(/__LBL__(.*)$/);if(lm){tail=lm[1].trim();line=line.replace(/__LBL__.*$/,'')}
    const parts=line.split(/\s*(<?(?:-->|---|-\.->|-\.-|==>|===|->|→))\s*(?:\|([^|]*)\|)?\s*/);
    let prev=null;
    for(let i=0;i<parts.length;i+=3){const tok=(parts[i]||'').trim();if(!tok){prev=null;continue}
      const id=node(tok);if(prev&&i>0){edges.push({from:prev,to:id,op:parts[i-2],label:((parts[i-1]||'')||(i===parts.length-1&&tail)||'').trim()})}prev=id}
  }
  return{dir,nodes:order.map(id=>nodes.get(id)),edges};
}
function layoutGraph(nodes,edges,dir){
  const n=nodes.length,ix=new Map(nodes.map((v,i)=>[v.id,i])),out=nodes.map(()=>[]);
  edges.forEach(e=>{const a=ix.get(e.from),b=ix.get(e.to);if(a!=null&&b!=null&&a!==b&&!out[a].includes(b))out[a].push(b)});
  const state=new Array(n).fill(0),dag=nodes.map(()=>[]);
  const visit=u=>{state[u]=1;for(const v of out[u]){if(state[v]===1)continue;dag[u].push(v);if(state[v]===0)visit(v)}state[u]=2};
  const indeg=new Array(n).fill(0);out.forEach(l=>l.forEach(v=>indeg[v]++));
  for(let i=0;i<n;i++)if(!indeg[i]&&!state[i])visit(i);for(let i=0;i<n;i++)if(!state[i])visit(i);
  const rank=new Array(n).fill(0),ind=new Array(n).fill(0);dag.forEach(l=>l.forEach(v=>ind[v]++));
  const q=[];for(let i=0;i<n;i++)if(!ind[i])q.push(i);
  while(q.length){const u=q.shift();for(const v of dag[u]){rank[v]=Math.max(rank[v],rank[u]+1);if(--ind[v]===0)q.push(v)}}
  const R=Math.max(0,...rank),layers=Array.from({length:R+1},()=>[]);for(let i=0;i<n;i++)layers[rank[i]].push(i);
  const preds=nodes.map(()=>[]);dag.forEach((l,u)=>l.forEach(v=>preds[v].push(u)));
  const pos=new Array(n).fill(0);layers.forEach(L=>L.forEach((u,i)=>pos[u]=i));
  for(let pass=0;pass<4;pass++)for(let r=1;r<=R;r++){const L=layers[r],bc=u=>preds[u].length?preds[u].reduce((s,p)=>s+pos[p],0)/preds[u].length:pos[u];L.sort((a,b)=>bc(a)-bc(b));L.forEach((u,i)=>pos[u]=i)}
  const hz=dir==='LR'||dir==='RL',along=i=>hz?nodes[i].w:nodes[i].h,cross=i=>hz?nodes[i].h:nodes[i].w,gA=hz?90:70,gC=hz?40:56,C=new Array(n).fill(0);
  layers.forEach((L,r)=>{const tot=L.reduce((s,u)=>s+cross(u),0)+gC*(L.length-1);let p=-tot/2;
    const des=L.map(u=>preds[u].length?preds[u].reduce((s,k)=>s+C[k],0)/preds[u].length:null);
    if(r===0||des.every(d=>d==null)){L.forEach(u=>{C[u]=p+cross(u)/2;p+=cross(u)+gC});return}
    let prevR=-Infinity;L.forEach((u,i)=>{let c=des[i]!=null?des[i]:(prevR===-Infinity?p+cross(u)/2:prevR+gC+cross(u)/2);c=Math.max(c,prevR+gC+cross(u)/2);C[u]=c;prevR=c+cross(u)/2});
    const span=prevR-(C[L[0]]-cross(L[0])/2),want=L.reduce((s,u,i)=>s+(des[i]!=null?des[i]-C[u]:0),0)/Math.max(1,des.filter(d=>d!=null).length);
    if(want<0&&span>0)L.forEach(u=>C[u]+=want/2)});
  const Apos=[];let acc=0;layers.forEach((L,r)=>{const m=Math.max(...L.map(along));Apos[r]=acc+m/2;acc+=m+gA});
  const res=new Map();
  for(let i=0;i<n;i++){let cx=hz?Apos[rank[i]]:C[i],cy=hz?C[i]:Apos[rank[i]];if(dir==='BT')cy=-cy;if(dir==='RL')cx=-cx;res.set(nodes[i].id,{x:cx-nodes[i].w/2,y:cy-nodes[i].h/2})}
  return res;
}
function flowItems(r){
  const f=fontStr(DEF_SHAPE);mc.font=f;const shapes=new Map(),list=[];
  for(const nd of r.nodes){const lines=nd.label.split('\n'),tw=Math.max(...lines.map(l=>mc.measureText(l).width));
    let w=clamp(tw+44,120,230),spec={k:'rect',s:{r:6}};
    const wl=wrap(nd.label,w-28,f).length;let h=Math.max(56,wl*18.2+26);
    switch(nd.shape){case'round':spec={k:'rect',s:{r:14}};break;case'pill':spec={k:'pill'};h=Math.max(52,h-4);break;case'diamond':spec={k:'diamond'};w=clamp(tw*1.7+50,140,280);h=Math.max(96,wrap(nd.label,w*.6,f).length*18+60);break;
      case'circle':spec={k:'ellipse'};w=h=Math.max(80,tw+36);break;case'cylinder':spec={k:'cylinder'};h+=26;break;case'hexagon':spec={k:'hexagon'};w+=30;break;case'parallelogram':spec={k:'parallelogram'};w+=30;break}
    const s=mkShape({...spec,w,h},0,0,w,h);s.text=nd.label;shapes.set(nd.id,s);list.push(s)}
  const pos=layoutGraph(r.nodes.map(nd=>({id:nd.id,w:shapes.get(nd.id).w,h:shapes.get(nd.id).h})),r.edges,r.dir);
  for(const[id,p]of pos){const s=shapes.get(id);s.x=Math.round(p.x);s.y=Math.round(p.y)}
  const eds=[];for(const e of r.edges){const a=shapes.get(e.from),b=shapes.get(e.to);if(!a||!b)continue;const ed=mkEdge({id:a.id},{id:b.id});ed.route='ortho';ed.text=e.label||'';
    const op=e.op||'';if(/^<?(---|-\.-|===)$/.test(op))ed.s.end='none';if(op.includes('.'))ed.s.dash='dashed';if(op.includes('='))ed.s.sw=2.5;if(op.startsWith('<'))ed.s.start='arrow';eds.push(ed)}
  return{shapes:list,edges:eds};
}
function insertFlow(r){
  const{shapes,edges}=flowItems(r);if(!shapes.length)return;const b=bboxOf(shapes),c=viewCenter();
  let dx=Math.round(c.x-b.x-b.w/2),dy=Math.round(c.y-b.y-b.h/2);
  const pb=bboxOf(items()),nb={x:b.x+dx,y:b.y+dy,w:b.w,h:b.h};
  if(pb&&overlaps(nb,pb)){dx=Math.round(pb.x+pb.w+120-b.x);dy=Math.round(pb.y-b.y)}
  shapes.forEach(s=>{s.x+=dx;s.y+=dy});
  addItems([...shapes,...edges]);sel=new Set(shapes.map(s=>s.id));commit();
  fitTo(bboxOf(items()),1.2);
}
function tidy(dir){
  let S=selShapes().filter(s=>s.type!=='container');if(S.length<2)S=items().filter(s=>isShape(s)&&s.type!=='container');if(S.length<2){toast('Add a few connected shapes first');return}
  const ids=new Set(S.map(s=>s.id)),E=items().filter(e=>isEdge(e)&&ids.has(e.a.id)&&ids.has(e.b.id)).map(e=>({from:e.a.id,to:e.b.id}));
  const b=bboxOf(S),pos=layoutGraph(S.map(s=>({id:s.id,w:s.w,h:s.h})),E,dir);
  let x1=Infinity,y1=Infinity;for(const p of pos.values()){x1=Math.min(x1,p.x);y1=Math.min(y1,p.y)}
  for(const s of S){const p=pos.get(s.id);s.x=Math.round(b.x+p.x-x1);s.y=Math.round(b.y+p.y-y1)}
  for(const e of items())if(isEdge(e)&&ids.has(e.a.id)&&ids.has(e.b.id)){delete e.a.side;delete e.b.side}
  commit();toast('Arranged '+S.length+' shapes');
}

const slug=s=>(String(s||'diagram').trim().replace(/[^\w\- ]+/g,'').replace(/\s+/g,'-').toLowerCase()||'diagram').slice(0,60);
const SVG_DEFS='<defs><filter id="lwShadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b1220" flood-opacity=".18"/></filter></defs>';
function bgColor(bg){return bg==='dark'?AUTO.dark.bg:bg==='transparent'?null:'#ffffff'}
function buildSVG(list,o){
  const ctx={edit:false,theme:o.bg==='dark'?'dark':'light'};ctx.bgc=bgColor(o.bg)||'#ffffff';
  const b=bboxOf(list)||{x:0,y:0,w:200,h:120},pad=+o.pad||0;
  const x=Math.floor(b.x-pad),y=Math.floor(b.y-pad),W=Math.ceil(b.w+pad*2),H=Math.ceil(b.h+pad*2);
  const body=list.map(it=>isEdge(it)?renderEdge(it,ctx):renderShape(it,ctx)).join('');
  const bg=bgColor(o.bg)?`<rect x="${x}" y="${y}" width="${W}" height="${H}" fill="${bgColor(o.bg)}"/>`:'';
  return{svg:`<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${W}" height="${H}" viewBox="${x} ${y} ${W} ${H}">${SVG_DEFS}${bg}${body}</svg>`,W,H};
}
function withPage(pid,fn){const cur=doc.pageId;doc.pageId=pid;try{return fn()}finally{doc.pageId=cur}}
function exportList(area){if(area==='selection'&&sel.size){const p=payload();return p?p.items.map(i=>byId(i.id)).filter(Boolean):items()}return items()}
function rasterize(r,scale,fill){
  return new Promise((res,rej)=>{
    let s=scale;const maxSide=12000;s=Math.min(s,maxSide/r.W,maxSide/r.H,Math.sqrt(1.1e8/(r.W*r.H)));
    const img=new Image(),url=URL.createObjectURL(new Blob([r.svg],{type:'image/svg+xml;charset=utf-8'}));
    img.onload=()=>{const c=document.createElement('canvas');c.width=Math.max(1,Math.round(r.W*s));c.height=Math.max(1,Math.round(r.H*s));const g=c.getContext('2d');
      if(fill){g.fillStyle=fill;g.fillRect(0,0,c.width,c.height)}g.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c)};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('the browser could not draw the diagram'))};img.src=url;
  });
}
const canvasBlob=(c,type,q)=>new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('image encoding failed')),type,q));
async function buildPDF(pages){
  const enc=new TextEncoder(),chunks=[],offs=[];let len=0;
  const push=x=>{const b=typeof x==='string'?enc.encode(x):x;chunks.push(b);len+=b.length};
  const obj=(i,body)=>{offs[i]=len;push(`${i} 0 obj\n`);typeof body==='string'?push(body):body();push('\nendobj\n')};
  push('%PDF-1.4\n%\xff\xff\xff\xff\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,`<< /Type /Pages /Kids [${pages.map((_,i)=>`${3+3*i} 0 R`).join(' ')}] /Count ${pages.length} >>`);
  for(let i=0;i<pages.length;i++){const p=pages[i],jpg=new Uint8Array(await(await canvasBlob(p.c,'image/jpeg',.93)).arrayBuffer()),pw=N(p.W*.75),ph=N(p.H*.75);
    obj(3+3*i,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 ${4+3*i} 0 R >> >> /Contents ${5+3*i} 0 R >>`);
    obj(4+3*i,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${p.c.width} /Height ${p.c.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);push(jpg);push('\nendstream')});
    const cs=`q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;obj(5+3*i,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`)}
  const total=3+3*pages.length,xref=len;
  push(`xref\n0 ${total}\n0000000000 65535 f \n`);for(let i=1;i<total;i++)push(String(offs[i]).padStart(10,'0')+' 00000 n \n');
  push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(chunks,{type:'application/pdf'});
}
let dlP=null;
function downloadsCap(){if(dlP)return dlP;const c=window.claude;dlP=c&&typeof c.use==='function'?Promise.resolve(c.use('downloads')).catch(()=>null):Promise.resolve(null);return dlP}
async function saveFile(name,blob){
  let dl=null;try{dl=await Promise.race([downloadsCap(),new Promise(r=>setTimeout(()=>r(null),2500))])}catch(_){}
  if(dl){try{await dl.save({filename:name,data:blob});toast('Saved '+name);return true}catch(err){const c=err&&err.code;
    if(c==='declined'){toast('Download cancelled');return false}if(c==='rate_limited'){toast('A save prompt is already open');return false}
    if(c==='rejected_extension'||c==='extension_not_enabled'){toast('That format cannot be saved here. Try PNG or JSON.');return false}
    if(c==='too_large'){toast('That file is too large here. Try a smaller scale.');return false}}}
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('Downloaded '+name);return true;
}
let exOpt={fmt:'png',area:'page',scale:2,bg:'white',pad:32,name:''},exURL=null;
async function makeExport(o){
  const name=(o.name||slug(doc.name)).replace(/[\\/:*?"<>|]+/g,'-');
  if(o.fmt==='json')return{name:name+'.json',blob:new Blob([JSON.stringify(doc,null,1)],{type:'application/json'})};
  if(o.fmt==='svg'){const r=buildSVG(exportList(o.area),o);return{name:name+'.svg',blob:new Blob([r.svg],{type:'image/svg+xml'})}}
  if(o.fmt==='png'){const r=buildSVG(exportList(o.area),o),c=await rasterize(r,o.scale,bgColor(o.bg));return{name:name+'.png',blob:await canvasBlob(c,'image/png')}}
  const pids=o.area==='all'?doc.pages.map(p=>p.id):[doc.pageId],pages=[];
  for(const pid of pids){const r=withPage(pid,()=>{const L=pid===doc.pageId?exportList(o.area):items();return L.length?buildSVG(L,o):null});if(!r)continue;pages.push({c:await rasterize(r,o.scale,bgColor(o.bg)||'#ffffff'),W:r.W,H:r.H})}
  if(!pages.length)throw new Error('there is nothing on the page yet');
  return{name:name+'.pdf',blob:await buildPDF(pages)};
}
async function quick(fmt){try{const r=await makeExport({...exOpt,fmt,area:fmt==='pdf'?'all':(sel.size?'selection':'page')});await saveFile(r.name,r.blob)}catch(err){toast('Export failed: '+(err.message||err))}}

    }else h+=`<p class="hint" style="margin:0">A complete backup of every page. Open it later from the diagram menu, or drop the file onto the canvas.</p>`;
    h+=`<div><span class="lbl">File name</span><input class="field" id="exName" value="${esc(exOpt.name||slug(doc.name))}" spellcheck="false"></div>`;
    opts.innerHTML=h;$('#exCopy',m).textContent=f==='png'?'Copy image':f==='svg'?'Copy SVG code':f==='json'?'Copy JSON':'Copy image of page';preview()};
  let pT=null;
  const preview=()=>{clearTimeout(pT);pT=setTimeout(()=>{

    const img=$('#exImg',m);if(img)img.src=exURL;

    meta.textContent=!list.length?'Nothing on this page yet':f==='svg'?`${r.W} × ${r.H} px, vector, ${list.length} items`:f==='json'?`${doc.pages.length} page${doc.pages.length>1?'s':''}, full backup`:
      f==='pdf'&&exOpt.area==='all'?(n=>`${n} page${n===1?'':'s'} at ${exOpt.scale}×`)(doc.pages.filter(p=>p.items.length).length):`${Math.round(r.W*exOpt.scale)} × ${Math.round(r.H*exOpt.scale)} px`;
  },60)};
  opts.addEventListener('click',e=>{const b=e.target.closest('[data-ex] button');if(!b||b.disabled)return;const k=b.parentElement.dataset.ex;exOpt[k]=JSON.parse(b.dataset.v);

  $('#exGo',m).addEventListener('click',async e=>{const b=e.currentTarget;b.disabled=true;try{const r=await makeExport(exOpt);await saveFile(r.name,r.blob)}catch(err){toast('Export failed: '+(err.message||err))}b.disabled=false});
  $('#exCopy',m).addEventListener('click',()=>{const f=exOpt.fmt;
    try{
      if(f==='svg'||f==='json'){const txt=f==='svg'?buildSVG(exportList(exOpt.area),exOpt).svg:JSON.stringify(doc,null,1);navigator.clipboard.writeText(txt).then(()=>toast('Copied to clipboard'),()=>toast('Copying is blocked here. Use Download.'));return}
      const blobP=(async()=>{const r=buildSVG(exportList(exOpt.area==='all'?'page':exOpt.area),exOpt);const c=await rasterize(r,exOpt.scale,bgColor(exOpt.bg));return canvasBlob(c,'image/png')})();
      navigator.clipboard.write([new ClipboardItem({'image/png':blobP})]).then(()=>toast('Image copied. Paste it into Slides, Docs or email.'),()=>toast('Copying images is blocked here. Use Download.'));

/* ================= images & files ================= */
function insertImage(file,at){
  const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{
    let w=img.naturalWidth||400,h=img.naturalHeight||300,src=rd.result;const max=1600;
    if((w>max||h>max)&&!/svg/.test(file.type)){const k=max/Math.max(w,h),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);src=c.toDataURL(file.type==='image/png'?'image/png':'image/jpeg',.9);w=c.width;h=c.height}
    const dw=Math.min(w,480),dh=dw*h/w,p=at||viewCenter();
    const s=normItem({id:uid(),type:'image',x:Math.round(p.x-dw/2),y:Math.round(p.y-dh/2),w:dw,h:dh,src,text:'',s:{...DEF_SHAPE,fill:'none',stroke:'none'}});
    addItems([s]);sel=new Set([s.id]);commit();if(!store.set('linework.probe',src.slice(0,10)))toast('Image added. Storage may be nearly full.');store.del('linework.probe')};
    img.onerror=()=>toast('That image could not be read');img.src=rd.result};
  rd.readAsDataURL(file);
}
function importFile(file){
  const rd=new FileReader();rd.onload=()=>{const j=safeParse(rd.result);
    if(j&&Array.isArray(j.pages)){saveNow();const d=normalizeDoc(j);d.id=uid();openDoc(d);saveNow();toast('Opened '+d.name);return}
    if(j&&j.linework&&Array.isArray(j.items)){clip=j;pasteN=0;pasteInternal();return}
    if(typeof rd.result==='string'&&/(-->|->)/.test(rd.result)){const r=parseFlow(rd.result);if(r.nodes.length){insertFlow(r);return}}
    toast('That file is not a Linework diagram')};
  rd.readAsText(file);
}
$('#imgIn').addEventListener('change',e=>{const f=e.target.files[0];if(f)insertImage(f);e.target.value=''});
$('#fileIn').addEventListener('change',e=>{const f=e.target.files[0];if(f)importFile(f);e.target.value=''});
wrapEl.addEventListener('dragover',e=>{if([...(e.dataTransfer&&e.dataTransfer.types||[])].includes('Files')){e.preventDefault();e.dataTransfer.dropEffect='copy'}});
wrapEl.addEventListener('drop',e=>{const fs=[...(e.dataTransfer&&e.dataTransfer.files||[])];if(!fs.length)return;e.preventDefault();const at=toWorld(e.clientX,e.clientY);

/* ================= sample diagram ================= */
const SAMPLE=`flowchart TD
  A([Referral received]) --> B[Log referral in the CRM]
  B --> C{Funding type?}
  C -->|NDIS| D[Check plan goals and budget]
  C -->|Private| E[Send fee schedule]
  D --> F[Intake call]
  E --> F
  F --> G{Good fit for our team?}
  G -->|Yes| H[Book initial assessment]
  G -->|No| I[Refer on with warm handover]
  H --> J([Welcome pack sent])`;
function sampleDoc(){
  const d=newDoc('Example: client intake flow');doc=d;
  const{shapes,edges}=flowItems(parseFlow(SAMPLE));
  for(const s of shapes){if(s.type==='pill')Object.assign(s.s,{fill:'#e6f5e1',stroke:'#2f8a3a',color:'#1b4d21'});if(s.type==='diamond')Object.assign(s.s,{fill:'#fdf2d8',stroke:'#b7791f',color:'#5c3d0c'})}
  const b=bboxOf(shapes);
  const note=mkShape(findSpec('note'),Math.round(b.x+b.w+70),Math.round(b.y+10));note.h=190;note.w=200;
  note.text='Example diagram. Click any shape, then drag a blue dot to connect, or click a dot to add the next step. Press '+MOD+'K for every command.';
  const fr=mkShape(findSpec('container'),Math.round(b.x-40),Math.round(b.y-70),Math.round(b.w+80),Math.round(b.h+110));fr.text='Intake (example)';
  d.pages[0].items=[fr,...shapes,...edges,note];d.pages[0].name='Intake';
  const p2=newPage('Ideas');d.pages.push(p2);
  return d;
}
